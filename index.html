<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KlimaService</title>
    <script>
        // Static hosting has no server-side language detection: pick the visitor's browser language.
        (function () {
            var supported = ["de","en","hu"];
            var preferred = navigator.languages || [navigator.language || ''];
            for (var i = 0; i < preferred.length; i++) {
                var code = String(preferred[i]).slice(0, 2).toLowerCase();
                if (supported.indexOf(code) !== -1) {
                    location.replace(code + '/index.html');
                    return;
                }
            }
            location.replace('de/index.html');
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=de/index.html"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; padding: 2rem">
            <a href="de/index.html">DE</a> ·             <a href="en/index.html">EN</a> ·             <a href="hu/index.html">HU</a>    </body>
</html>
